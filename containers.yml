  dockerfile: ubuntu
  build-args:
    MPICH_VERSION: "{{ package("mpich") }}"
    OPENMPI_VERSION: "{{ package("openmpi") }}"
  tags:
    - "mpich{{ package("mpich") }}"
    - "openmpi{{ package("openmpi") }}"
  release: true
  date: "20260918"
mpi-ubuntu24-clang:
  from: compiler-ubuntu24-clang
  dockerfile: ubuntu
  build-args:
    MPICH_VERSION: "{{ package("mpich") }}"
    OPENMPI_VERSION: "{{ package("openmpi") }}"
  tags:
    - "mpich{{ package("mpich") }}"
    - "openmpi{{ package("openmpi") }}"
  release: true
  date: "20260918"
mpi-ubuntu24-gcc:
  from: compiler-ubuntu24-gcc
  dockerfile: ubuntu
  build-args:
    MPICH_VERSION: "{{ package("mpich") }}"
    OPENMPI_VERSION: "{{ package("openmpi") }}"
  tags:
    - "mpich{{ package("mpich") }}"
    - "openmpi{{ package("openmpi") }}"
  release: true
  date: "20260918"
mpi-ubuntu24-gccmin:
  from: compiler-ubuntu24-gccmin
  dockerfile: ubuntu
  build-args:
    MPICH_VERSION: "{{ package("mpich") }}"
  tags:
    - "mpich{{ package("mpich") }}"
  release: true
  date: "20260918"
