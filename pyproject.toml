[project]
name = "moose-containers"
version = "0.1.0"
description = "Utilities for building MOOSE base containers"
requires-python = ">=3.14"
dependencies = [
    "jinja2",
    "pyyaml",
    "tabulate",
    "requests",
    "ruff",
]

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.lint]
select = ["D", "E", "F", "I", "N801", "SIM", "TID"]
ignore = ["D203", "D213"]
