      !cancelled()
      && contains(fromJSON('["success", "skipped"]'), needs.moose-base-rocky8.result)
      && needs.prepare.outputs.changed-moose-compiler-rocky8-gcc
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
