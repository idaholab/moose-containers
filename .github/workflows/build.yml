        if: github.event_name == 'pull_request_target' && (github.event_name == 'push' || (github.event_name == 'pull_request_target') == (github.event.pull_request.head.repo.full_name != github.repository))
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
          fetch-depth: 1
          # Required to check out a fork on pull_request_target. Safe here,
          # as nothing from pr/ is run on the runner
          allow-unsafe-pr-checkout: true
      - name: Check pull request
        # A symlink could point the build at files outside of pr/, such as
        # the registry login
        if: github.event_name == 'pull_request_target' && (github.event_name == 'push' || (github.event_name == 'pull_request_target') == (github.event.pull_request.head.repo.full_name != github.repository))
        shell: bash
        run: |
          links=$(find pr -path pr/.git -prune -o -type l -print)
          if [ -n "$links" ]; then
