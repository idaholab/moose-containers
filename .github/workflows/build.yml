  prepare:
    name: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request_target') == (github.event.pull_request.head.repo.full_name != github.repository)) && 'prepare' || 'prepare (not used)' }}
    needs: [fork-pr, ruff, pytest, delete-images, delete-cache]
    # Never skipped; see required_name at the top of this file
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    permissions:
      contents: read
      packages: read
      pull-requests: write
    outputs:
      containers: ${{ steps.prepare.outputs.containers }}
    steps:
      - name: Not used
        if: ${{ !((github.event_name == 'push' || (github.event_name == 'pull_request_target') == (github.event.pull_request.head.repo.full_name != github.repository))) }}
        shell: bash
        run: echo "This job only does work in the other run for this event"
      - name: Check jobs
        if: >-
          (github.event_name == 'push' || (github.event_name == 'pull_request_target') == (github.event.pull_request.head.repo.full_name != github.repository))
          && !((github.event_name == 'pull_request_target' && needs.fork-pr.result == 'success' || github.event_name != 'pull_request_target' && needs.ruff.result == 'success' && needs.pytest.result == 'success')
