  mpi-ubuntu24-gccmin:
    name: "mpi-ubuntu24-gccmin"
    needs: [prepare, compiler-ubuntu24-gccmin]
    if: >-
      !cancelled()
      && contains(fromJSON('["success", "skipped"]'), needs.compiler-ubuntu24-gccmin.result)
      && needs.prepare.outputs.changed-mpi-ubuntu24-gccmin
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        uses: ./.github/actions/build
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          context: docker/mpi
          file: docker/mpi/ubuntu/Dockerfile
          uri: ${{ needs.prepare.outputs.uri-mpi-ubuntu24-gccmin }}
          build-args: |
            BUILD_FROM=${{ needs.prepare.outputs.uri-compiler-ubuntu24-gccmin }}
            MPICH_VERSION=${{ needs.prepare.outputs.package-mpich }}

  finalize:
    name: "finalize"
    needs:
      - mpi-rocky8-cuda-gcc
      - mpi-rocky8-gcc
      - mpi-rocky8-oneapi
      - mpi-rocky9-gcc
      - mpi-ubuntu24-clang
      - mpi-ubuntu24-cuda-gcc
      - mpi-ubuntu24-gcc
      - mpi-ubuntu24-gccmin
    if: >-
      !cancelled()
      && contains(fromJSON('["success", "skipped"]'), needs.mpi-rocky8-cuda-gcc.result)
      && contains(fromJSON('["success", "skipped"]'), needs.mpi-rocky8-gcc.result)
      && contains(fromJSON('["success", "skipped"]'), needs.mpi-rocky8-oneapi.result)
      && contains(fromJSON('["success", "skipped"]'), needs.mpi-rocky9-gcc.result)
      && contains(fromJSON('["success", "skipped"]'), needs.mpi-ubuntu24-clang.result)
      && contains(fromJSON('["success", "skipped"]'), needs.mpi-ubuntu24-cuda-gcc.result)
      && contains(fromJSON('["success", "skipped"]'), needs.mpi-ubuntu24-gcc.result)
      && contains(fromJSON('["success", "skipped"]'), needs.mpi-ubuntu24-gccmin.result)
    runs-on: ubuntu-slim
    steps:
      - name: Finalize
        run: echo "it worked"
