      - name: Install uv
        if: (github.event_name == 'push' || (github.event_name == 'pull_request_target') == (github.event.pull_request.head.repo.full_name != github.repository))
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: ${{ github.event_name != 'pull_request_target' }}
      - name: Prepare
        id: prepare
        if: (github.event_name == 'push' || (github.event_name == 'pull_request_target') == (github.event.pull_request.head.repo.full_name != github.repository))
        shell: bash
        env:
          MOOSECONTAINERS_REPO_ROOT: ${{ github.event_name == 'pull_request_target' && format('{0}/pr', github.workspace) || '' }}
        run: |
          prepare_cmd=("uv" "run" "--frozen" "moosecontainers")
          prepare_args=("--github-token" "${{ secrets.GITHUB_TOKEN }}")
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            "${prepare_cmd[@]}" \
              prepare_pr \
              "${{ github.event.pull_request.number }}" \
              "${{ github.event.pull_request.base.sha }}" \
              "${prepare_args[@]}"
          elif [ "$GITHUB_EVENT_NAME" == "push" ]; then
            "${prepare_cmd[@]}" \
              prepare_push \
              "${{ github.event.before }}" \
              "${prepare_args[@]}"
