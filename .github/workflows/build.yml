      - name: Delete
        shell: bash
        env:
          PYTHONUNBUFFERED: 1
          MOOSECONTAINERS_REPO_ROOT: ${{ github.event_name == 'pull_request_target' && format('{0}/pr', github.workspace) || '' }}
        run: |
          uv run --frozen moosecontainers \
            delete_pr \
            "${{ github.event.pull_request.number }}" \
            --only-cache \
            --allow-missing-repos \
            --github-token ${{ github.token }}

  generated:
    name: generated
    needs: [ruff, pytest]
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Check README
        shell: bash
        run: uv run --frozen moosecontainers readme --check
      - name: Check workflows
