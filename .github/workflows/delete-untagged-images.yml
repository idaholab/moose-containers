name: Delete untagged images

on:
  workflow_dispatch:

jobs:
  delete-untagged-images:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Deleted untagged images
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/scripts/delete-untagged-images.bash
