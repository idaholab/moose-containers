name: Delete PR images

on:
  pull_request:
    types: [closed]

jobs:
  delete:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Delete
        shell: bash
        env:
          PYTHONUNBUFFERED: 1
        run: |
          uv run --frozen python ./.github/scripts/ci.py \
            delete_pr \
            "${{ github.event.pull_request.number }}" \
            --github-token ${{ github.token }}
