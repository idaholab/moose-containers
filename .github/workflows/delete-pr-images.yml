name: Delete PR images

on:
  pull_request:
    types: [closed]

jobs:
  delete:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install python
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen
      - name: Delete PR images
        shell: bash
        env:
          PYTHONUNBUFFERED: 1
        run: |
          source .venv/bin/activate
          python ./.github/scripts/ci.py \
            delete_pr \
            "${{ github.event.pull_request.number }}" \
            --github-token ${{ github.token }}
