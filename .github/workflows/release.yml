          from-uri: ${{ needs.prepare.outputs.from-moose-mpi-ubuntu24-clang }}
          to-uri: ${{ needs.prepare.outputs.to-moose-mpi-ubuntu24-clang }}

  moose-mpi-ubuntu24-gcc:
    name: "moose-mpi-ubuntu24-gcc"
    needs: [prepare, merge-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    if: >-
      needs.merge-release.result == 'success'
      && needs.prepare.outputs.to-moose-mpi-ubuntu24-gcc
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Release
        uses: ./.github/actions/release
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          from-uri: ${{ needs.prepare.outputs.from-moose-mpi-ubuntu24-gcc }}
          to-uri: ${{ needs.prepare.outputs.to-moose-mpi-ubuntu24-gcc }}

  moose-mpi-ubuntu24-gccmin:
    name: "moose-mpi-ubuntu24-gccmin"
    needs: [prepare, merge-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    if: >-
      needs.merge-release.result == 'success'
      && needs.prepare.outputs.to-moose-mpi-ubuntu24-gccmin
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Release
        uses: ./.github/actions/release
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          from-uri: ${{ needs.prepare.outputs.from-moose-mpi-ubuntu24-gccmin }}
          to-uri: ${{ needs.prepare.outputs.to-moose-mpi-ubuntu24-gccmin }}
