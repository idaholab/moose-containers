name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without making changes"
        required: false
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-slim
    permissions:
      contents: read
      packages: read
    outputs:
      releases: ${{ steps.prepare.outputs.releases }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Prepare
        id: prepare
        shell: bash
        run: |
          uv run --frozen python ./.github/scripts/ci.py prepare_release --github-token "${{ secrets.GITHUB_TOKEN }}"

  merge-release:
    name: merge-release
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && !inputs.dry_run }}
    runs-on: ubuntu-slim
    environment: ${{ !inputs.dry_run && 'release' || '' }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check branch
        shell: bash
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Error: This workflow can only be run on 'main'"
            exit 1
          fi
      - name: Merge main into release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout release
          git merge --no-ff origin/main -m "Merge main into release"
          git push origin release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: release-${{ matrix.name }}
    needs: [prepare, merge-release]
    if: >-
      needs.merge-release.result == 'success'
      && needs.prepare.outputs.releases != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      # Release the containers that can be, even if one fails
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.releases) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Release
        uses: ./.github/actions/release
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          from-uri: ${{ matrix.from }}
          to-uri: ${{ matrix.to }}

  finalize:
    name: "finalize"
    needs: [prepare, merge-release, release]
    # Always run, so that this required check fails rather than being
    # skipped (which GitHub reports as success) when a build fails
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check jobs
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
        shell: bash
        run: |
          echo "::error::A job that finalize depends on did not succeed"
          exit 1
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Check
        shell: bash
        run: |
          uv run --frozen python ./.github/scripts/ci.py \
            post_release \
            --github-token "${{ secrets.GITHUB_TOKEN }}"
