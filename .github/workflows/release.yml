name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without making changes"
        required: false
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-slim
    permissions:
      contents: read
      packages: read
    outputs:
      from-moose-mpi-rocky8-cuda-gcc: ${{ steps.parse.outputs.from-moose-mpi-rocky8-cuda-gcc }}
      from-moose-mpi-rocky8-gcc: ${{ steps.parse.outputs.from-moose-mpi-rocky8-gcc }}
      from-moose-mpi-rocky8-oneapi: ${{ steps.parse.outputs.from-moose-mpi-rocky8-oneapi }}
      from-moose-mpi-rocky9-gcc: ${{ steps.parse.outputs.from-moose-mpi-rocky9-gcc }}
      from-moose-mpi-ubuntu24-cuda-gcc: ${{ steps.parse.outputs.from-moose-mpi-ubuntu24-cuda-gcc }}
      from-moose-mpi-ubuntu24-clang: ${{ steps.parse.outputs.from-moose-mpi-ubuntu24-clang }}
      from-moose-mpi-ubuntu24-gcc: ${{ steps.parse.outputs.from-moose-mpi-ubuntu24-gcc }}
      from-moose-mpi-ubuntu24-gccmin: ${{ steps.parse.outputs.from-moose-mpi-ubuntu24-gccmin }}
      to-moose-mpi-rocky8-cuda-gcc: ${{ steps.parse.outputs.to-moose-mpi-rocky8-cuda-gcc }}
      to-moose-mpi-rocky8-gcc: ${{ steps.parse.outputs.to-moose-mpi-rocky8-gcc }}
      to-moose-mpi-rocky8-oneapi: ${{ steps.parse.outputs.to-moose-mpi-rocky8-oneapi }}
      to-moose-mpi-rocky9-gcc: ${{ steps.parse.outputs.to-moose-mpi-rocky9-gcc }}
      to-moose-mpi-ubuntu24-cuda-gcc: ${{ steps.parse.outputs.to-moose-mpi-ubuntu24-cuda-gcc }}
      to-moose-mpi-ubuntu24-clang: ${{ steps.parse.outputs.to-moose-mpi-ubuntu24-clang }}
      to-moose-mpi-ubuntu24-gcc: ${{ steps.parse.outputs.to-moose-mpi-ubuntu24-gcc }}
      to-moose-mpi-ubuntu24-gccmin: ${{ steps.parse.outputs.to-moose-mpi-ubuntu24-gccmin }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install python
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen
      - name: Parse
        id: parse
        shell: bash
        run: |
          source .venv/bin/activate
          python ./.github/scripts/ci.py release --github-token "${{ secrets.GITHUB_TOKEN }}"

  merge-release:
    name: merge-release
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && !inputs.dry_run }}
    runs-on: ubuntu-slim
    environment: ${{ !inputs.dry_run && 'release' || '' }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check branch
        shell: bash
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Error: This workflow can only be run on 'main'"
            exit 1
          fi
      - name: Merge main into release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout release
          git merge --no-ff origin/main -m "Merge main into release"
          git push origin release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  moose-mpi-rocky8-cuda-gcc:
    name: "moose-mpi-rocky8-cuda-gcc"
    needs: [prepare, merge-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    if: >-
      needs.merge-release.result == 'success'
      && needs.prepare.outputs.to-moose-mpi-rocky8-cuda-gcc
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Release
        uses: ./.github/actions/release
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          from-uri: ${{ needs.prepare.outputs.from-moose-mpi-rocky8-cuda-gcc }}
          to-uri: ${{ needs.prepare.outputs.to-moose-mpi-rocky8-cuda-gcc }}

  moose-mpi-rocky8-gcc:
    name: "moose-mpi-rocky8-gcc"
    needs: [prepare, merge-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    if: >-
      needs.merge-release.result == 'success'
      && needs.prepare.outputs.to-moose-mpi-rocky8-gcc
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Release
        uses: ./.github/actions/release
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          from-uri: ${{ needs.prepare.outputs.from-moose-mpi-rocky8-gcc }}
          to-uri: ${{ needs.prepare.outputs.to-moose-mpi-rocky8-gcc }}

  moose-mpi-rocky8-oneapi:
    name: "moose-mpi-rocky8-oneapi"
    needs: [prepare, merge-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    if: >-
      needs.merge-release.result == 'success'
      && needs.prepare.outputs.to-moose-mpi-rocky8-oneapi
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Release
        uses: ./.github/actions/release
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          from-uri: ${{ needs.prepare.outputs.from-moose-mpi-rocky8-oneapi }}
          to-uri: ${{ needs.prepare.outputs.to-moose-mpi-rocky8-oneapi }}

  moose-mpi-rocky9-gcc:
    name: "moose-mpi-rocky9-gcc"
    needs: [prepare, merge-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    if: >-
      needs.merge-release.result == 'success'
      && needs.prepare.outputs.to-moose-mpi-rocky9-gcc
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Release
        uses: ./.github/actions/release
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          from-uri: ${{ needs.prepare.outputs.from-moose-mpi-rocky9-gcc }}
          to-uri: ${{ needs.prepare.outputs.to-moose-mpi-rocky9-gcc }}

  moose-mpi-ubuntu24-cuda-gcc:
    name: "moose-mpi-ubuntu24-cuda-gcc"
    needs: [prepare, merge-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    if: >-
      needs.merge-release.result == 'success'
      && needs.prepare.outputs.to-moose-mpi-ubuntu24-cuda-gcc
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Release
        uses: ./.github/actions/release
        with:
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          from-uri: ${{ needs.prepare.outputs.from-moose-mpi-ubuntu24-cuda-gcc }}
          to-uri: ${{ needs.prepare.outputs.to-moose-mpi-ubuntu24-cuda-gcc }}

  moose-mpi-ubuntu24-clang:
